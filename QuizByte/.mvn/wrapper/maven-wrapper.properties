wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.zip

# Conexão MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/meu_banco?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuração JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# Pool de conexões (opcional)
spring.datasource.hikari.maximum-pool-size=10   # Máximo de conexões abertas simultaneamente
spring.datasource.hikari.minimum-idle=2        # Mínimo de conexões ociosas no pool
spring.datasource.hikari.idle-timeout=30000    # Tempo que uma conexão ociosa fica no pool (ms)
spring.datasource.hikari.max-lifetime=600000   # Tempo máximo de vida de uma conexão (ms)


